name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install -r app/requirements.txt pyinstaller pillow
      - name: Engine tests
        working-directory: calculations
        run: python -m unittest discover -s tests
      - name: Build app
        run: python app/build.py
      - name: Version
        shell: bash
        run: echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Self-test packaged app (Linux)
        if: runner.os == 'Linux'
        run: dist/PowerEquipmentStudio/PowerEquipmentStudio --selftest
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cp app/install_linux.sh app/assets/icon.png dist/PowerEquipmentStudio/
          tar -C dist -czf "dist/PowerEquipmentStudio-${APP_VERSION}-linux-x86_64.tar.gz" PowerEquipmentStudio

      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" app\installer.iss
          Compress-Archive -Path dist\PowerEquipmentStudio -DestinationPath "dist\PowerEquipmentStudio-$env:APP_VERSION-windows-portable.zip"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/PowerEquipmentStudio.app "dist/PowerEquipmentStudio-${APP_VERSION}-macos.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: PowerEquipmentStudio-${{ matrix.os }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*-setup.exe
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*-setup.exe
