name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run tests
        working-directory: calculations
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        working-directory: calculations
        run: python -m pecalc cablebus --voltage 600 --current 3000 --size 750 --per-phase 7 --length 200 --fault-ka 65 --xr 20 --fault-time 0.5

  test-numpy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install optional numpy fast path
        run: python -m pip install numpy
      - name: Run tests with numpy
        working-directory: calculations
        run: python -m unittest discover -s tests -v

  app-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install app requirements
        run: python -m pip install -r app/requirements.txt
      - name: Run the desktop app's self-test from source
        run: python app/main.py --selftest
